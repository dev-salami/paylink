services:
  app:
    build:
      context: .
      dockerfile: apps/paylink-solana/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: https://${DOMAIN:-localhost}
      PORT: "3000"
    volumes:
      - paylink-data:/app/apps/paylink-solana/data
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  paylink-data:
  caddy-data:
  caddy-config:
